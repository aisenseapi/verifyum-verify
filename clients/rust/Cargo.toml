[package]
name = "verifyum-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Verifyum verification primitives R1 to R11 and the byte-exact check program"
license = "MIT"
publish = false

[lib]
name = "verifyum"
path = "src/lib.rs"

[[bin]]
name = "check"
path = "src/bin/check.rs"

[dependencies]
# preserve_order must stay OFF: the BTreeMap-backed Map gives the byte-ordered keys JCS needs.
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
# Verify only; no signing, no rand.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
hex = { version = "=0.4.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 2
debug = false
